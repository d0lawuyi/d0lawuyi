name: Update profile panels
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["profile.json", "scripts/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Generate SVG panels
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python scripts/generate.py --config profile.json --out assets
      - name: Commit if changed
        run: |
          git config user.name "profile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: refresh profile panels"
          git push
